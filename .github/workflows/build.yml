name: Build DNSTT Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Clone DNSTT Source
        run: |
          git clone https://www.bamsoftware.com/git/dnstt.git
          cd dnstt/dnstt-client

      - name: Compile ARM64 Binary
        run: |
          cd dnstt/dnstt-client
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o libdns.so

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libdns-arm64
          path: dnstt/dnstt-client/libdns.so
